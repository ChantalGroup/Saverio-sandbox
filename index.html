<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D GLB Viewer Demo</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      background-color: #f0f0f0;
    }
    header {
      flex-shrink: 0;
      padding: 1rem;
      background: #333;
      color: white;
      text-align: center;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 1.2rem;
      flex-grow: 1;
    }
    .debug-btn {
      padding: 0.5rem 1rem;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }
    .debug-panel {
      position: fixed;
      top: 0;
      right: -400px;
      width: 350px;
      height: 100%;
      background: white;
      box-shadow: -2px 0 10px rgba(0,0,0,0.2);
      transition: right 0.3s ease;
      z-index: 1000;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .debug-panel.open {
      right: 0;
    }
    .debug-panel h2 {
      margin-top: 0;
      border-bottom: 1px solid #ddd;
      padding-bottom: 0.5rem;
    }
    .panel-section {
      border: 1px solid #eee;
      padding: 0.5rem;
      border-radius: 4px;
    }
    .panel-section h3 {
      margin-top: 0;
      font-size: 1rem;
    }
    .control-group {
      margin-bottom: 0.5rem;
      display: flex;
      flex-direction: column;
    }
    .control-group label {
      font-size: 0.8rem;
      margin-bottom: 0.2rem;
    }
    .export-btn {
      margin-top: 1rem;
      padding: 0.5rem;
      background: #28a745;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }
    #viewer-container {
      position: relative;
      flex: 1;
      width: 100%;
      background-color: #eee;
    }
    #viewer-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .controls {
      padding: 1rem;
      background: white;
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
    .loader {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      transition: opacity 0.4s ease;
    }
    .loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loader-logo {
      width: 40%;
      max-width: 220px;
      height: auto;
    }
    .loader-bar {
      width: 240px;
      max-width: 60vw;
      height: 6px;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 3px;
      overflow: hidden;
    }
    .loader-bar-fill {
      height: 100%;
      width: 0%;
      background: #007bff;
      transition: width 0.2s ease;
    }
    .loader-percent {
      color: #333;
      font-family: sans-serif;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div id="loader" class="loader">
    <img src="/public/assets/images/Chantal.svg" alt="Chantal" class="loader-logo">
    <div class="loader-bar">
      <div id="loaderFill" class="loader-bar-fill"></div>
    </div>
    <div id="loaderPercent" class="loader-percent">0%</div>
  </div>

  <header>
    <div style="width: 120px;"></div> <!-- Spacer for centering -->
    <h1>Chantal - Virtual try on - POC 00.00 - Saverio Trapasso</h1>
    <button class="debug-btn" onclick="toggleDebug()">DEBUG LOOKDEV</button>
  </header>

  <div id="debugPanel" class="debug-panel">
    <h2>Debug Lookdev</h2>

    <div class="panel-section">
      <h3>Lighting (HDRI)</h3>
      <div class="control-group">
        <label>HDRI</label>
        <select id="hdriSelect">
          <option value="/public/assets/hdri/T_kloppenheim_06_puresky_4k.exr" selected>Kloppenheim Puresky</option>
        </select>
      </div>
      <div class="control-group">
        <label>Rotation</label>
        <input type="range" id="hdriRotation" min="0" max="360" value="0">
      </div>
      <div class="control-group">
        <label>Exposure</label>
        <input type="range" id="hdriExposure" min="0" max="2" step="0.01" value="1">
      </div>
    </div>

    <div class="panel-section">
      <h3>Camera</h3>
      <div class="control-group">
        <label>Offset X</label>
        <input type="number" id="camOffsetX" step="0.01" value="0">
      </div>
      <div class="control-group">
        <label>Offset Y</label>
        <input type="number" id="camOffsetY" step="0.01" value="0">
      </div>
      <div class="control-group">
        <label>Offset Z</label>
        <input type="number" id="camOffsetZ" step="0.01" value="0">
      </div>
    </div>

    <div class="panel-section">
      <h3>Scale</h3>
      <div id="scaleList">
        <!-- Will be populated by JS -->
      </div>
    </div>

    <div class="panel-section">
      <h3>Materials</h3>
      <div id="materialsList">
        <!-- Will be populated by JS -->
      </div>
    </div>

    <button class="export-btn" onclick="exportJson()">Export JSON</button>

    <div class="control-group">
      <label>Remote save password</label>
      <input type="password" id="savePassword">
    </div>
    <button class="export-btn" onclick="saveRemote()">Save to GitHub</button>
    <div id="saveStatus" style="font-size: 0.75rem; word-break: break-all;"></div>

    <button class="debug-btn" style="background: #6c757d;" onclick="toggleDebug()">Close</button>
  </div>

  <div id="viewer-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EXRLoader } from 'three/addons/loaders/EXRLoader.js';

    const MODELS = {
      floor: { path: '/public/assets/3d/SM_Floor.glb', label: 'Floor', scale: 3 },
      garment: { path: '/public/assets/3d/SM_CottonTshirt.glb', label: 'Garment' },
      character: { path: '/public/assets/3d/SM_Male_Character.glb', label: 'Character' }
    };

    const loader = document.getElementById('loader');
    const loaderFill = document.getElementById('loaderFill');
    const loaderPercent = document.getElementById('loaderPercent');
    const container = document.getElementById('viewer-container');
    const debugPanel = document.getElementById('debugPanel');
    const hdriSelect = document.getElementById('hdriSelect');
    const hdriRotation = document.getElementById('hdriRotation');
    const hdriExposure = document.getElementById('hdriExposure');
    const materialsList = document.getElementById('materialsList');
    const scaleList = document.getElementById('scaleList');
    const camOffsetX = document.getElementById('camOffsetX');
    const camOffsetY = document.getElementById('camOffsetY');
    const camOffsetZ = document.getElementById('camOffsetZ');
    const savePassword = document.getElementById('savePassword');
    const saveStatus = document.getElementById('saveStatus');

    const scene = new THREE.Scene();
    const modelGroup = new THREE.Group();
    scene.add(modelGroup);

    const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = parseFloat(hdriExposure.value);
    renderer.setClearColor(0xeeeeee, 1); // fallback finché l'HDRI (che è l'unica fonte di luce) non è caricata
    container.appendChild(renderer.domElement);

    // Solo orbita e zoom: niente pan, così l'utente non può "perdere" la scena/l'HDRI di sfondo.
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enablePan = false;

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();

    const gltfLoader = new GLTFLoader();
    const exrLoader = new EXRLoader();

    const materials = new Map();
    let currentEnvTexture = null;
    const sceneCenter = new THREE.Vector3(); // centro scena calcolato da frameScene(), riferimento per l'offset camera

    function resize() {
      const width = container.clientWidth;
      const height = container.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }
    window.addEventListener('resize', resize);

    function frameScene() {
      const box = new THREE.Box3().setFromObject(modelGroup);
      if (box.isEmpty()) return;

      const center = box.getCenter(new THREE.Vector3());
      sceneCenter.copy(center);
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);

      const fov = camera.fov * (Math.PI / 180);
      const distance = (maxDim / 2 / Math.tan(fov / 2)) * 1.6;
      const direction = new THREE.Vector3(1, 0.6, 1).normalize();

      camera.position.copy(center).add(direction.multiplyScalar(distance));
      camera.near = Math.max(maxDim / 100, 0.01);
      camera.far = maxDim * 100;
      camera.updateProjectionMatrix();

      controls.target.copy(center);
      controls.update();
    }

    // Sposta insieme target e camera dello stesso delta (mantenendo l'angolo/zoom
    // correnti): un "pan" controllato via numeri invece che via drag del mouse,
    // dato che il pan libero è disattivato di proposito.
    function applyCameraOffset() {
      const newTarget = new THREE.Vector3(
        sceneCenter.x + (parseFloat(camOffsetX.value) || 0),
        sceneCenter.y + (parseFloat(camOffsetY.value) || 0),
        sceneCenter.z + (parseFloat(camOffsetZ.value) || 0)
      );
      const delta = newTarget.clone().sub(controls.target);
      camera.position.add(delta);
      controls.target.copy(newTarget);
      controls.update();
    }

    [camOffsetX, camOffsetY, camOffsetZ].forEach((input) => {
      input.addEventListener('input', applyCameraOffset);
    });

    // Il GLB può contenere materiali non-PBR (es. MeshBasicMaterial/Lambert/Phong):
    // dato che l'unica luce in scena è l'IBL dell'HDRI, li normalizziamo tutti a
    // THREE.MeshPhysicalMaterial (il materiale PBR completo di three.js) così
    // rispondono correttamente all'environment lighting.
    function toPbrMaterial(source) {
      if (source instanceof THREE.MeshPhysicalMaterial) return source;

      const pbr = new THREE.MeshPhysicalMaterial({
        name: source.name,
        map: source.map ?? null,
        normalMap: source.normalMap ?? null,
        aoMap: source.aoMap ?? null,
        aoMapIntensity: source.aoMapIntensity ?? 1,
        alphaMap: source.alphaMap ?? null,
        emissiveMap: source.emissiveMap ?? null,
        emissiveIntensity: source.emissiveIntensity ?? 1,
        metalnessMap: source.metalnessMap ?? null,
        roughnessMap: source.roughnessMap ?? null,
        transparent: source.transparent ?? false,
        opacity: source.opacity ?? 1,
        side: source.side ?? THREE.FrontSide,
        // fallback dielettrico (non metallico, opaco): un materiale "basico" senza
        // metalness/roughness propri non è quasi mai un metallo lucido
        metalness: source.metalness ?? 0,
        roughness: source.roughness ?? 1
      });
      pbr.color.copy(source.color ?? new THREE.Color(0xffffff));
      pbr.emissive.copy(source.emissive ?? new THREE.Color(0x000000));
      return pbr;
    }

    function collectMaterials(root) {
      root.traverse((node) => {
        if (!node.isMesh) return;
        if (Array.isArray(node.material)) {
          node.material = node.material.map(toPbrMaterial);
          node.material.forEach((m) => materials.set(m.uuid, m));
        } else {
          node.material = toPbrMaterial(node.material);
          materials.set(node.material.uuid, node.material);
        }
      });
    }

    const modelRoots = new Map(); // key -> THREE.Object3D

    // Ogni asset ha il proprio pivot locale in (0,0,0) ed è questo il riferimento
    // di allineamento tra pavimento/maglietta/personaggio: niente ricentraggio
    // basato su bounding box, i root restano all'origine così come esportati, e
    // la scala (vedi buildScaleControls) viene applicata attorno a quello stesso pivot.
    async function loadModel(key, onProgress) {
      const { path, scale } = MODELS[key];
      const gltf = await gltfLoader.loadAsync(path, onProgress);
      const root = gltf.scene;
      root.name = key;
      if (scale !== undefined) root.scale.setScalar(scale);

      collectMaterials(root);
      modelGroup.add(root);
      modelRoots.set(key, root);
    }

    function buildScaleControls() {
      scaleList.innerHTML = '';

      modelRoots.forEach((root, key) => {
        const group = document.createElement('div');
        group.className = 'control-group';

        const label = document.createElement('label');
        label.innerText = MODELS[key].label;
        group.appendChild(label);

        const input = document.createElement('input');
        input.type = 'number';
        input.step = 0.001;
        input.min = 0.001;
        input.value = root.scale.x;
        input.addEventListener('input', (e) => {
          const value = parseFloat(e.target.value);
          if (Number.isFinite(value) && value > 0) {
            root.scale.setScalar(value);
          }
        });
        group.appendChild(input);

        scaleList.appendChild(group);
      });
    }

    function applyEnvironmentRotation() {
      const rad = THREE.MathUtils.degToRad(parseFloat(hdriRotation.value));
      scene.environmentRotation.y = rad;
      scene.backgroundRotation.y = rad;
    }

    // L'HDRI è l'unica fonte di luce (nessuna luce piazzata a mano) ed è anche
    // sempre visibile come sfondo: scene.environment guida l'illuminazione PBR,
    // scene.background mostra l'immagine equirettangolare vera e propria.
    async function loadEnvironment(path, onProgress) {
      const texture = await exrLoader.loadAsync(path, onProgress);
      texture.mapping = THREE.EquirectangularReflectionMapping;

      const pmrem = pmremGenerator.fromEquirectangular(texture);
      scene.environment = pmrem.texture;
      scene.background = texture;
      applyEnvironmentRotation();

      if (currentEnvTexture) currentEnvTexture.dispose();
      currentEnvTexture = texture;
    }

    // HDRI Controls
    hdriSelect.addEventListener('change', (e) => {
      loadEnvironment(e.target.value);
    });

    hdriRotation.addEventListener('input', () => {
      applyEnvironmentRotation();
    });

    hdriExposure.addEventListener('input', (e) => {
      renderer.toneMappingExposure = parseFloat(e.target.value);
    });

    // Schema di tutti i parametri scalari/colore esposti da THREE.MeshPhysicalMaterial
    // (il PBR completo di three.js). Escluse solo le texture map (nessun upload richiesto).
    const MATERIAL_PARAMS = [
      { key: 'color', label: 'Base Color', type: 'color' },
      { key: 'opacity', label: 'Opacity', type: 'range', min: 0, max: 1, step: 0.01 },
      { key: 'transparent', label: 'Transparent', type: 'checkbox' },
      { key: 'metalness', label: 'Metalness', type: 'range', min: 0, max: 1, step: 0.01 },
      { key: 'roughness', label: 'Roughness', type: 'range', min: 0, max: 1, step: 0.01 },
      { key: 'emissive', label: 'Emissive Color', type: 'color' },
      { key: 'emissiveIntensity', label: 'Emissive Intensity', type: 'number', min: 0, step: 0.01 },
      { key: 'envMapIntensity', label: 'Env Map Intensity', type: 'number', min: 0, step: 0.01 },
      { key: 'ior', label: 'IOR', type: 'range', min: 1, max: 2.333, step: 0.001 },
      { key: 'specularIntensity', label: 'Specular Intensity', type: 'range', min: 0, max: 1, step: 0.01 },
      { key: 'specularColor', label: 'Specular Color', type: 'color' },
      { key: 'clearcoat', label: 'Clearcoat', type: 'range', min: 0, max: 1, step: 0.01 },
      { key: 'clearcoatRoughness', label: 'Clearcoat Roughness', type: 'range', min: 0, max: 1, step: 0.01 },
      { key: 'sheen', label: 'Sheen', type: 'range', min: 0, max: 1, step: 0.01 },
      { key: 'sheenRoughness', label: 'Sheen Roughness', type: 'range', min: 0, max: 1, step: 0.01 },
      { key: 'sheenColor', label: 'Sheen Color', type: 'color' },
      { key: 'transmission', label: 'Transmission', type: 'range', min: 0, max: 1, step: 0.01 },
      { key: 'thickness', label: 'Thickness', type: 'number', min: 0, step: 0.01 },
      { key: 'attenuationDistance', label: 'Attenuation Distance', type: 'number', min: 0, step: 0.1 },
      { key: 'attenuationColor', label: 'Attenuation Color', type: 'color' },
      { key: 'iridescence', label: 'Iridescence', type: 'range', min: 0, max: 1, step: 0.01 },
      { key: 'iridescenceIOR', label: 'Iridescence IOR', type: 'range', min: 1, max: 2.333, step: 0.001 },
      { key: 'anisotropy', label: 'Anisotropy', type: 'range', min: 0, max: 1, step: 0.01 },
      { key: 'anisotropyRotation', label: 'Anisotropy Rotation', type: 'number', min: 0, max: 6.283, step: 0.01 },
      {
        key: 'side',
        label: 'Side',
        type: 'select',
        options: [
          { value: THREE.FrontSide, label: 'Front' },
          { value: THREE.BackSide, label: 'Back' },
          { value: THREE.DoubleSide, label: 'Double' }
        ]
      },
      { key: 'wireframe', label: 'Wireframe', type: 'checkbox' },
      { key: 'flatShading', label: 'Flat Shading', type: 'checkbox' }
    ];

    function createParamControl(material, def) {
      const group = document.createElement('div');
      group.className = 'control-group';

      const label = document.createElement('label');
      label.innerText = def.label;
      group.appendChild(label);

      let input;

      if (def.type === 'color') {
        input = document.createElement('input');
        input.type = 'color';
        input.value = `#${material[def.key].getHexString()}`;
        input.addEventListener('input', (e) => {
          material[def.key].set(e.target.value);
          material.needsUpdate = true;
        });
      } else if (def.type === 'checkbox') {
        input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = !!material[def.key];
        input.addEventListener('change', (e) => {
          material[def.key] = e.target.checked;
          material.needsUpdate = true;
        });
      } else if (def.type === 'select') {
        input = document.createElement('select');
        def.options.forEach((opt) => {
          const optionEl = document.createElement('option');
          optionEl.value = opt.value;
          optionEl.innerText = opt.label;
          if (material[def.key] === opt.value) optionEl.selected = true;
          input.appendChild(optionEl);
        });
        input.addEventListener('change', (e) => {
          material[def.key] = parseInt(e.target.value, 10);
          material.needsUpdate = true;
        });
      } else {
        input = document.createElement('input');
        input.type = def.type; // 'range' o 'number'
        if (def.min !== undefined) input.min = def.min;
        if (def.max !== undefined) input.max = def.max;
        input.step = def.step ?? 0.01;
        const current = material[def.key];
        input.value = Number.isFinite(current) ? current : '';
        input.addEventListener('input', (e) => {
          const value = parseFloat(e.target.value);
          if (Number.isFinite(value)) {
            material[def.key] = value;
            material.needsUpdate = true;
          }
        });
      }

      group.appendChild(input);
      return group;
    }

    function populateMaterials() {
      materialsList.innerHTML = '';

      materials.forEach((material) => {
        const section = document.createElement('div');
        section.style.borderTop = '1px solid #eee';
        section.style.paddingTop = '0.5rem';
        section.style.marginBottom = '0.5rem';

        const name = document.createElement('label');
        name.innerHTML = `<strong>${material.name || 'Material'}</strong>`;
        section.appendChild(name);

        MATERIAL_PARAMS.forEach((def) => {
          section.appendChild(createParamControl(material, def));
        });

        materialsList.appendChild(section);
      });
    }

    function serializeParamValue(material, def) {
      if (def.type === 'color') return `#${material[def.key].getHexString()}`;
      return material[def.key];
    }

    // Stato completo della scena (lighting + camera + scala + tutti i parametri
    // materiale): usato sia dall'export locale che dal salvataggio remoto.
    function buildConfig() {
      return {
        lighting: {
          hdri: hdriSelect.value,
          rotation: parseFloat(hdriRotation.value) || 0,
          exposure: parseFloat(hdriExposure.value) || 0
        },
        camera: {
          offsetX: parseFloat(camOffsetX.value) || 0,
          offsetY: parseFloat(camOffsetY.value) || 0,
          offsetZ: parseFloat(camOffsetZ.value) || 0
        },
        scale: Object.fromEntries(
          Array.from(modelRoots.entries()).map(([key, root]) => [key, root.scale.x])
        ),
        materials: Array.from(materials.values()).map((m) => {
          const params = {};
          MATERIAL_PARAMS.forEach((def) => {
            params[def.key] = serializeParamValue(m, def);
          });
          return { name: m.name, ...params };
        })
      };
    }

    function exportJson() {
      const data = buildConfig();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'lookdev_settings.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    // Chiama la Serverless Function /api/save-config, che fa il commit del JSON
    // su GitHub (vedi api/save-config.js). Richiede GITHUB_TOKEN/GITHUB_REPO/
    // SAVE_SECRET configurate come env var su Vercel.
    async function saveRemote() {
      saveStatus.innerText = 'Saving...';
      try {
        const res = await fetch('/api/save-config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ secret: savePassword.value, config: buildConfig() })
        });
        const data = await res.json();
        if (!res.ok) {
          saveStatus.innerText = `Error: ${data.error || res.status}`;
          return;
        }
        saveStatus.innerText = data.commitUrl ? `Saved: ${data.commitUrl}` : 'Saved to GitHub.';
      } catch (err) {
        saveStatus.innerText = `Network error: ${err.message || err}`;
      }
    }

    function toggleDebug() {
      debugPanel.classList.toggle('open');
      if (debugPanel.classList.contains('open')) {
        populateMaterials();
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    // Progresso reale (byte scaricati) dell'HDRI + dei 3 GLB, combinati in
    // un'unica percentuale per la barra del loader iniziale.
    const loadProgress = new Map(); // key -> { loaded, total }

    function updateLoaderBar() {
      const entries = Array.from(loadProgress.values());
      if (!entries.length) return;
      const loaded = entries.reduce((sum, p) => sum + p.loaded, 0);
      const total = entries.reduce((sum, p) => sum + (p.total || p.loaded), 0);
      const pct = total > 0 ? Math.min(100, Math.round((loaded / total) * 100)) : 0;
      loaderFill.style.width = `${pct}%`;
      loaderPercent.innerText = `${pct}%`;
    }

    function trackProgress(key) {
      loadProgress.set(key, { loaded: 0, total: 0 });
      return (event) => {
        loadProgress.set(key, {
          loaded: event.loaded,
          total: event.lengthComputable ? event.total : event.loaded
        });
        updateLoaderBar();
      };
    }

    function hideLoader() {
      loader.classList.add('hidden');
      loader.addEventListener('transitionend', () => loader.remove(), { once: true });
    }

    async function init() {
      resize();
      try {
        await Promise.all([
          loadEnvironment(hdriSelect.value, trackProgress('hdri')),
          ...Object.keys(MODELS).map((key) => loadModel(key, trackProgress(key)))
        ]);
      } catch (err) {
        loaderPercent.innerText = `Loading error: ${err.message || err}`;
        return;
      }
      buildScaleControls();
      frameScene();
      animate();
      hideLoader();
    }

    // onclick inline handlers richiedono queste funzioni nello scope globale
    window.toggleDebug = toggleDebug;
    window.exportJson = exportJson;
    window.saveRemote = saveRemote;

    init();
  </script>

  <div class="controls" style="display:none;">
    <p>Models displayed: <code>SM_Floor.glb</code> + <code>SM_CottonTshirt.glb</code> + <code>SM_Male_Character.glb</code></p>
  </div>
</body>
</html>
