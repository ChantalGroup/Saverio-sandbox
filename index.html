<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D GLB Viewer Demo</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #f0f0f0;
    }
    header {
      padding: 1rem;
      background: #333;
      color: white;
      text-align: center;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 1.2rem;
      flex-grow: 1;
    }
    .debug-btn {
      padding: 0.5rem 1rem;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }
    .debug-panel {
      position: fixed;
      top: 0;
      right: -400px;
      width: 350px;
      height: 100%;
      background: white;
      box-shadow: -2px 0 10px rgba(0,0,0,0.2);
      transition: right 0.3s ease;
      z-index: 1000;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .debug-panel.open {
      right: 0;
    }
    .debug-panel h2 {
      margin-top: 0;
      border-bottom: 1px solid #ddd;
      padding-bottom: 0.5rem;
    }
    .panel-section {
      border: 1px solid #eee;
      padding: 0.5rem;
      border-radius: 4px;
    }
    .panel-section h3 {
      margin-top: 0;
      font-size: 1rem;
    }
    .control-group {
      margin-bottom: 0.5rem;
      display: flex;
      flex-direction: column;
    }
    .control-group label {
      font-size: 0.8rem;
      margin-bottom: 0.2rem;
    }
    .export-btn {
      margin-top: 1rem;
      padding: 0.5rem;
      background: #28a745;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }
    #viewer-container {
      position: relative;
      flex: 1;
      width: 100%;
      background-color: #eee;
    }
    #viewer-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .controls {
      padding: 1rem;
      background: white;
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <div style="width: 120px;"></div> <!-- Spacer for centering -->
    <h1>Chantal - Virtual try on - POC 00.00 - Saverio Trapasso</h1>
    <button class="debug-btn" onclick="toggleDebug()">DEBUG LOOKDEV</button>
  </header>

  <div id="debugPanel" class="debug-panel">
    <h2>Debug Lookdev</h2>

    <div class="panel-section">
      <h3>Lighting</h3>
      <div class="control-group">
        <label>HDRI</label>
        <select id="hdriSelect">
          <option value="">Default (solo luci)</option>
          <option value="/public/assets/hdri/studio_kominka_02_2k.exr" selected>Studio Kominka</option>
          <option value="/public/assets/hdri/tree_lined_driveway_2k.exr">Tree Lined Driveway</option>
          <option value="/public/assets/hdri/wooden_studio_09_2k.exr">Wooden Studio</option>
        </select>
      </div>
      <div class="control-group">
        <label>Rotation</label>
        <input type="range" id="hdriRotation" min="0" max="360" value="0">
      </div>
      <div class="control-group">
        <label>Exposure</label>
        <input type="range" id="hdriExposure" min="0" max="2" step="0.01" value="1">
      </div>
    </div>

    <div class="panel-section">
      <h3>Materials</h3>
      <div id="materialsList">
        <!-- Will be populated by JS -->
      </div>
    </div>

    <button class="export-btn" onclick="exportJson()">Esporta JSON</button>
    <button class="debug-btn" style="background: #6c757d;" onclick="toggleDebug()">Chiudi</button>
  </div>

  <div id="viewer-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EXRLoader } from 'three/addons/loaders/EXRLoader.js';

    const MODELS = {
      floor: '/public/assets/3d/SM_Floor.glb',
      garment: '/public/assets/3d/SM_CottonTshirt.glb'
    };

    const container = document.getElementById('viewer-container');
    const debugPanel = document.getElementById('debugPanel');
    const hdriSelect = document.getElementById('hdriSelect');
    const hdriRotation = document.getElementById('hdriRotation');
    const hdriExposure = document.getElementById('hdriExposure');
    const materialsList = document.getElementById('materialsList');

    const scene = new THREE.Scene();
    const modelGroup = new THREE.Group();
    scene.add(modelGroup);

    const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = parseFloat(hdriExposure.value);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0xeeeeee, 1);
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    scene.add(keyLight);
    scene.add(keyLight.target);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();

    const gltfLoader = new GLTFLoader();
    const exrLoader = new EXRLoader();

    const materials = new Map();

    function resize() {
      const width = container.clientWidth;
      const height = container.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }
    window.addEventListener('resize', resize);

    function frameScene() {
      const box = new THREE.Box3().setFromObject(modelGroup);
      if (box.isEmpty()) return;

      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);

      const fov = camera.fov * (Math.PI / 180);
      const distance = (maxDim / 2 / Math.tan(fov / 2)) * 1.6;
      const direction = new THREE.Vector3(1, 0.6, 1).normalize();

      camera.position.copy(center).add(direction.multiplyScalar(distance));
      camera.near = Math.max(maxDim / 100, 0.01);
      camera.far = maxDim * 100;
      camera.updateProjectionMatrix();

      controls.target.copy(center);
      controls.update();

      keyLight.position.copy(center).add(new THREE.Vector3(maxDim, maxDim * 1.5, maxDim));
      keyLight.target.position.copy(center);
      keyLight.shadow.camera.left = -maxDim;
      keyLight.shadow.camera.right = maxDim;
      keyLight.shadow.camera.top = maxDim;
      keyLight.shadow.camera.bottom = -maxDim;
      keyLight.shadow.camera.near = 0.1;
      keyLight.shadow.camera.far = maxDim * 10;
      keyLight.shadow.camera.updateProjectionMatrix();
    }

    function collectMaterials(root) {
      root.traverse((node) => {
        if (!node.isMesh) return;
        node.castShadow = true;
        node.receiveShadow = true;
        const nodeMaterials = Array.isArray(node.material) ? node.material : [node.material];
        nodeMaterials.forEach((material) => {
          if (material && !materials.has(material.uuid)) {
            materials.set(material.uuid, material);
          }
        });
      });
    }

    async function loadFloor() {
      const gltf = await gltfLoader.loadAsync(MODELS.floor);
      const root = gltf.scene;

      const box = new THREE.Box3().setFromObject(root);
      const center = box.getCenter(new THREE.Vector3());
      root.position.x -= center.x;
      root.position.z -= center.z;
      root.position.y -= box.max.y; // porta la superficie superiore del pavimento a y = 0

      collectMaterials(root);
      modelGroup.add(root);
    }

    async function loadGarment() {
      const gltf = await gltfLoader.loadAsync(MODELS.garment);
      const root = gltf.scene;

      const box = new THREE.Box3().setFromObject(root);
      const center = box.getCenter(new THREE.Vector3());
      root.position.x -= center.x;
      root.position.z -= center.z;
      root.position.y -= box.min.y; // appoggia la base della maglietta a y = 0 (sul pavimento)

      collectMaterials(root);
      modelGroup.add(root);
    }

    function loadEnvironment(path) {
      if (!path) {
        scene.environment = null;
        return;
      }
      exrLoader.load(path, (texture) => {
        const envMap = pmremGenerator.fromEquirectangular(texture).texture;
        scene.environment = envMap;
        texture.dispose();
      });
    }

    // HDRI Controls
    hdriSelect.addEventListener('change', (e) => {
      loadEnvironment(e.target.value);
    });

    hdriRotation.addEventListener('input', (e) => {
      modelGroup.rotation.y = THREE.MathUtils.degToRad(parseFloat(e.target.value));
    });

    hdriExposure.addEventListener('input', (e) => {
      renderer.toneMappingExposure = parseFloat(e.target.value);
    });

    function populateMaterials() {
      materialsList.innerHTML = '';

      let index = 0;
      materials.forEach((material) => {
        const section = document.createElement('div');
        section.className = 'control-group';
        section.style.borderTop = '1px solid #eee';
        section.style.paddingTop = '0.5rem';

        const name = document.createElement('label');
        name.innerHTML = `<strong>${material.name || 'Material ' + index}</strong>`;
        section.appendChild(name);

        // Base Color
        const colorLabel = document.createElement('label');
        colorLabel.innerText = 'Base Color';
        const colorInput = document.createElement('input');
        colorInput.type = 'color';
        colorInput.value = `#${material.color.getHexString()}`;
        colorInput.addEventListener('input', (e) => {
          material.color.set(e.target.value);
        });
        section.appendChild(colorLabel);
        section.appendChild(colorInput);

        // Metallic
        const metallicLabel = document.createElement('label');
        metallicLabel.innerText = 'Metallic';
        const metallicInput = document.createElement('input');
        metallicInput.type = 'range';
        metallicInput.min = 0;
        metallicInput.max = 1;
        metallicInput.step = 0.01;
        metallicInput.value = material.metalness ?? 0;
        metallicInput.addEventListener('input', (e) => {
          material.metalness = parseFloat(e.target.value);
        });
        section.appendChild(metallicLabel);
        section.appendChild(metallicInput);

        // Roughness
        const roughnessLabel = document.createElement('label');
        roughnessLabel.innerText = 'Roughness';
        const roughnessInput = document.createElement('input');
        roughnessInput.type = 'range';
        roughnessInput.min = 0;
        roughnessInput.max = 1;
        roughnessInput.step = 0.01;
        roughnessInput.value = material.roughness ?? 1;
        roughnessInput.addEventListener('input', (e) => {
          material.roughness = parseFloat(e.target.value);
        });
        section.appendChild(roughnessLabel);
        section.appendChild(roughnessInput);

        materialsList.appendChild(section);
        index += 1;
      });
    }

    function exportJson() {
      const data = {
        lighting: {
          hdri: hdriSelect.value,
          rotation: hdriRotation.value,
          exposure: hdriExposure.value
        },
        materials: Array.from(materials.values()).map((m) => ({
          name: m.name,
          baseColorFactor: [m.color.r, m.color.g, m.color.b, m.opacity ?? 1],
          metallicFactor: m.metalness ?? 0,
          roughnessFactor: m.roughness ?? 1
        }))
      };

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'lookdev_settings.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function toggleDebug() {
      debugPanel.classList.toggle('open');
      if (debugPanel.classList.contains('open')) {
        populateMaterials();
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    async function init() {
      resize();
      loadEnvironment(hdriSelect.value);
      await Promise.all([loadFloor(), loadGarment()]);
      frameScene();
      animate();
    }

    // onclick inline handlers richiedono queste funzioni nello scope globale
    window.toggleDebug = toggleDebug;
    window.exportJson = exportJson;

    init();
  </script>

  <div class="controls" style="display:none;">
    <p>Modelli visualizzati: <code>SM_Floor.glb</code> + <code>SM_CottonTshirt.glb</code></p>
  </div>
</body>
</html>
